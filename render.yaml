# Render Blueprint: lets Render create the backend service, disk and env vars in one go.
# In Render: New > Blueprint, pick this repo, then fill in the two "sync: false" values.
services:
  - type: web
    name: skylearner-api
    runtime: node
    plan: starter            # persistent disks need a paid plan
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: DB_FILE
        value: /var/data/skylearner.db
      - key: ADMIN_KEY
        sync: false          # enter your admin key in the Render dashboard
      - key: FRONTEND_URL
        sync: false          # enter your website URL, e.g. https://skylearner.in
    disk:
      name: skylearner-data
      mountPath: /var/data
      sizeGB: 1
